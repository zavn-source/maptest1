<!DOCTYPE html>
<html lang="ro">
<head>
  <title>Hartă Interactivă</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS & JS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS & JS Leaflet Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

  <!-- JS Turf.js pentru calcule exacte de arie și perimetru -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    #map { 
      height: 100vh; 
      width: 100vw; 
    }

    /* Stil pentru butonul Înapoi */
    .back-button {
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-decoration: none;
      color: #1e293b;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-button:hover {
      background: #f1f5f9;
    }

    /* Stil pentru controalele de opacitate din selectorul de straturi */
    .layer-opacity-control {
      margin-top: 4px;
      margin-bottom: 8px;
      font-size: 11px;
      color: #475569;
    }
    .layer-opacity-control input {
      width: 100%;
      cursor: pointer;
      margin-top: 2px;
    }

    /* Stil pentru titlurile de secțiune din selectorul de straturi */
    .leaflet-control-layers-group-title {
      font-weight: bold;
      font-size: 12px;
      color: #0f172a;
      border-bottom: 1px solid #e2e8f0;
      margin-top: 6px;
      margin-bottom: 4px;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Inițializăm harta pe coordonatele Chișinăului
    const map = L.map('map').setView([47.0167, 28.8333], 13);

    // 2. Setări Geoman + Activare Măsurători (fără opțiunea de rotire)
    map.pm.addControls({
      position: 'topleft',
      drawMarker: true,
      drawPolyline: true,
      drawRectangle: true,
      drawPolygon: true,
      drawCircle: false,
      drawCircleMarker: false,
      editMode: false,      // Fără editare noduri pe straturi externe
      dragMode: false,      // Fără mutare
      cutPolygon: false,
      rotateMode: false,    // Butonul de rotire a fost scos
      removalMode: true     // Permite ștergerea geometriilor desenate
    });

    // 3. Calcul Arie și Perimetru cu Turf.js la crearea geometriilor
    map.on('pm:create', function(e) {
      const layer = e.layer;
      
      if (layer.options && layer.options.pmIgnore) return;

      const geojson = layer.toGeoJSON();

      if (e.shape === 'Line' || e.shape === 'Polyline') {
        const lengthMeters = turf.length(geojson, { units: 'meters' });
        let text = lengthMeters > 1000 
          ? (lengthMeters / 1000).toFixed(2) + ' km' 
          : lengthMeters.toFixed(1) + ' m';
        layer.bindPopup(`<b>Lungime:</b> ${text}`).openPopup();
      } 
      else if (e.shape === 'Polygon' || e.shape === 'Rectangle') {
        const areaM2 = turf.area(geojson);
        const perimeterMeters = turf.length(geojson, { units: 'meters' });

        let areaText = areaM2 >= 10000 
          ? (areaM2 / 10000).toFixed(2) + ' ha (' + (areaM2 / 1000000).toFixed(2) + ' km²)' 
          : areaM2.toFixed(1) + ' m²';

        let perimText = perimeterMeters >= 1000 
          ? (perimeterMeters / 1000).toFixed(2) + ' km' 
          : perimeterMeters.toFixed(1) + ' m';

        layer.bindPopup(`<b>Suprafață:</b> ${areaText}<br><b>Perimetru:</b> ${perimText}`).openPopup();
      }
    });

    // 4. Straturile de fundal (Base Layers)
    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles © Esri'
    });

    // 5. Butonul „Înapoi”
    const backControl = L.control({ position: 'topleft' });
    backControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.innerHTML = `<a href="../index.html" class="back-button">⬅️ Înapoi la Lista de Hărți</a>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    backControl.addTo(map);

// 6. Meniul de straturi cu deschidere la CLICK
    const baseMaps = {
      "Google Satelit": googleSat,
      "Esri Topografic": esriTopo
    };
    const overlayMaps = {};
    
    const layerControl = L.control.layers(baseMaps, overlayMaps, { 
      position: 'topright',
      collapsed: true 
    }).addTo(map);

    const layerContainer = layerControl.getContainer();
    
    // Отключаем открытие по наведению курсора (hover)
    L.DomEvent.off(layerContainer, 'mouseover', layerControl._expand, layerControl);
    L.DomEvent.off(layerContainer, 'mouseout', layerControl._collapse, layerControl);

    // Переключение меню строго по клику на иконку
    let menuOpen = false;
    L.DomEvent.on(layerContainer, 'click', function (e) {
      if (e.target.classList.contains('leaflet-control-layers-toggle')) {
        if (menuOpen) {
          layerControl.collapse();
          menuOpen = false;
        } else {
          layerControl.expand();
          menuOpen = true;
        }
      }
    });

    L.DomEvent.disableClickPropagation(layerContainer);
    L.DomEvent.disableScrollPropagation(layerContainer);
    
// 7. Funcție optimizată pentru adăugarea straturilor QGIS cu control de opacitate
    let layerCounter = 0;
    function addQGISLayer(data, labelName) {
      if (!data) return;

      layerCounter++;
      const layerId = 'qgis_layer_' + layerCounter;

      // stratul GeoJSON
      const qgisLayerGroup = L.geoJSON(data, {
        style: function () {
          return {
            color: "#ff3300",
            weight: 3,
            fillColor: "#ffff00",
            fillOpacity: 0.3,
            opacity: 1
          };
        },
        pointToLayer: function (feature, latlng) {
          const marker = L.circleMarker(latlng, {
            radius: 8,
            fillColor: "#ff3300",
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
          marker.options.pmIgnore = true;
          return marker;
        },
        onEachFeature: function (feature, layerObj) {
          if (layerObj && layerObj.options) {
            layerObj.options.pmIgnore = true; // reparare Geoman
          }

          if (feature.properties) {
            let popupContent = "<b>Atribute obiect:</b><br><hr style='margin:4px 0;'>";
            for (let prop in feature.properties) {
              popupContent += `<b>${prop}:</b> ${feature.properties[prop]}<br>`;
            }
            layerObj.bindPopup(popupContent);
          }
        }
      });

      // adaugare pe harta
      qgisLayerGroup.addTo(map);
      qgisLayerGroup.options.pmIgnore = true;

      // auto scalare
      try {
        if (qgisLayerGroup.getBounds && qgisLayerGroup.getBounds().isValid()) {
          map.fitBounds(qgisLayerGroup.getBounds());
        }
      } catch (err) {
        console.warn("Nu s-au putut calcula limitele stratului:", err);
      }

      // save linkul global
      window[layerId] = qgisLayerGroup;

      // HTML inauntrul modificarii straturilor
      const labelHTML = `${labelName}<br>` +
        `<div class="layer-opacity-control" style="margin-top:2px;" onclick="event.stopPropagation();">` +
        `Opacitate: <input type="range" min="0" max="1" step="0.1" value="0.3" ` +
        `oninput="changeLayerOpacity('${layerId}', this.value)" onclick="event.stopPropagation();">` +
        `</div>`;

      // registrarea stratului in meiul Leaflet
      layerControl.addOverlay(qgisLayerGroup, labelHTML);
    }

    // modificarea opacitatii tuturor geometriilor in strat
    window.changeLayerOpacity = function (layerId, val) {
      const targetLayer = window[layerId];
      if (targetLayer) {
        const opacityVal = parseFloat(val);
        targetLayer.eachLayer(function (l) {
          if (l.setStyle) {
            l.setStyle({ fillOpacity: opacityVal, opacity: opacityVal });
          }
        });
      }
    };

// 8. Poligon de rezervă (Fallback) în Chișinău dacă fișierul GeoJSON extern nu este găsit
    const defaultFallbackData = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "Nume": "Zonă demonstrativă Chișinău",
            "Sursa": "Poligon implicit (Fallback)",
            "Descriere": "Dacă vezi acest poligon, înseamnă că fișierul strat_qgis.geojson nu a fost încărcat sau lipsește."
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [28.8200, 47.0100],
                [28.8500, 47.0100],
                [28.8500, 47.0300],
                [28.8200, 47.0300],
                [28.8200, 47.0100]
              ]
            ]
          }
        }
      ]
    };

    // 9. Încărcare fișier GeoJSON din QGIS
    fetch('../straturi/strat_qgis.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Fișierul strat_qgis.geojson nu a fost găsit.');
        }
        return response.json();
      })
      .then(data => {
        console.log("Fișierul strat_qgis.geojson a fost încărcat cu succes.");
        addQGISLayer(data, "Strat din QGIS");
      })
      .catch(error => {
        console.warn("Nu s-a putut încărca 'strat_qgis.geojson'. Se afișează poligonul demonstrativ de rezervă în Chișinău.", error);
        addQGISLayer(defaultFallbackData, "Poligon Chișinău (Demo)");
      });
  </script>

</body>
</html>
