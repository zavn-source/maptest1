<!DOCTYPE html>
<html lang="ro">
<head>
  <title>Hartă Interactivă</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS & JS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS & JS pentru Leaflet Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    #map { 
      height: 100vh; 
      width: 100vw; 
    }

    /* Stil pentru butonul Înapoi */
    .back-button {
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-decoration: none;
      color: #1e293b;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-button:hover {
      background: #f1f5f9;
    }

    /* Stil pentru panoul de opacitate */
    .opacity-control {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: bold;
    }
    .opacity-control input {
      display: block;
      margin-top: 5px;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Inițializăm harta pe coordonatele Chișinăului
    const map = L.map('map').setView([47.0167, 28.8333], 13);

    // 2. Setări Geoman + Activare Măsurători
    map.pm.addControls({
      position: 'topleft',
      drawMarker: true,
      drawPolyline: true,
      drawRectangle: true,
      drawPolygon: true,
      drawCircle: false,
      drawCircleMarker: false,
      editMode: false,      // Fără editare noduri pe stratul extern
      dragMode: false,      // Fără mutare
      cutPolygon: false,
      removalMode: true     // Permite ștergerea DOAR a geometriilor desenate de tine
    });

    // Configurare opțiuni globale de măsurare
    map.pm.setGlobalOptions({
      tooltips: true,
      measurements: {
        measurement: true,
        displayFormat: 'metric' // m, km, m²
      }
    });

    // Calculează și afișează lungimea / aria în popup pentru fiecare geometrie desenată
    map.on('pm:create', function(e) {
      const layer = e.layer;
      
      // Dacă stratul desenat este protejat, nu facem nimic
      if (layer.options && layer.options.pmIgnore) return;

      if (e.shape === 'Line' || e.shape === 'Polyline') {
        let distance = 0;
        const latlngs = layer.getLatLngs();
        for (let i = 0; i < latlngs.length - 1; i++) {
          distance += latlngs[i].distanceTo(latlngs[i + 1]);
        }
        let text = distance > 1000 
          ? (distance / 1000).toFixed(2) + ' km' 
          : distance.toFixed(1) + ' m';
        layer.bindPopup(`<b>Lungime:</b> ${text}`).openPopup();
      } 
      else if (e.shape === 'Polygon' || e.shape === 'Rectangle') {
        const latlngs = layer.getLatLngs()[0];
        // Calcul arie folosind L.GeometryUtil sau calcul aproximativ
        let area = 0;
        if (L.GeometryUtil && L.GeometryUtil.geodesicArea) {
          area = L.GeometryUtil.geodesicArea(latlngs);
        } else {
          // Calcul perimetru ca fallback
          let perimeter = 0;
          for (let i = 0; i < latlngs.length; i++) {
            let nextIndex = (i + 1) % latlngs.length;
            perimeter += latlngs[i].distanceTo(latlngs[nextIndex]);
          }
          layer.bindPopup(`<b>Perimetru:</b> ${perimeter > 1000 ? (perimeter/1000).toFixed(2) + ' km' : perimeter.toFixed(1) + ' m'}`).openPopup();
          return;
        }
        let text = area > 10000 
          ? (area / 10000).toFixed(2) + ' ha (' + (area / 1000000).toFixed(2) + ' km²)' 
          : area.toFixed(1) + ' m²';
        layer.bindPopup(`<b>Suprafață:</b> ${text}`).openPopup();
      }
    });

    // 3. Straturile de fundal
    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    const osm = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© CARTO / OpenStreetMap'
    });

    // 4. Butonul „Înapoi”
    const backControl = L.control({ position: 'topleft' });
    backControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.innerHTML = `<a href="../index.html" class="back-button">⬅️ Înapoi la Lista de Hărți</a>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    backControl.addTo(map);

    // 5. Selectorul de straturi
    const baseMaps = {
      "Google Satelit": googleSat,
      "Hartă Deschisă (CARTO)": osm
    };
    const overlayMaps = {};
    const layerControl = L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

    let qgisLayer;

    // Poligon de rezervă (Fallback)
    const defaultFallbackData = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "Nume": "Zonă demonstrativă Chișinău",
            "Sursa": "Poligon implicit (Fallback)",
            "Descriere": "Dacă vezi acest poligon, înseamnă că fișierul strat_qgis.geojson nu a fost încărcat sau lipsește."
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [28.8200, 47.0100],
                [28.8500, 47.0100],
                [28.8500, 47.0300],
                [28.8200, 47.0300],
                [28.8200, 47.0100]
              ]
            ]
          }
        }
      ]
    };

    // Funcție pentru adăugarea datelor GeoJSON pe hartă
    function renderGeoJSON(data, label) {
      qgisLayer = L.geoJSON(data, {
        pmIgnore: true, // Stratul GeoJSON din QGIS este protejat complet
        style: {
          color: "#ff3300",
          weight: 3,
          fillColor: "#ffff00",
          fillOpacity: 0.3
        },
        pointToLayer: function (feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 8,
            fillColor: "#ff3300",
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          if (feature.properties) {
            let popupContent = "<b>Atribute obiect:</b><br><hr style='margin:4px 0;'>";
            for (let prop in feature.properties) {
              popupContent += `<b>${prop}:</b> ${feature.properties[prop]}<br>`;
            }
            layer.bindPopup(popupContent);
          }
        }
      }).addTo(map);

      if (qgisLayer.getBounds().isValid()) {
        map.fitBounds(qgisLayer.getBounds());
      }

      layerControl.addOverlay(qgisLayer, label);
    }

    // 6. Încărcare fișier GeoJSON din QGIS
    fetch('../straturi/strat_qgis.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Fișierul strat_qgis.geojson nu a fost găsit.');
        }
        return response.json();
      })
      .then(data => {
        console.log("Fișierul strat_qgis.geojson a fost încărcat cu succes.");
        renderGeoJSON(data, "Strat din QGIS");
      })
      .catch(error => {
        console.warn("Nu s-a putut încărca 'strat_qgis.geojson'. Se afișează poligonul demonstrativ de rezervă în Chișinău.", error);
        renderGeoJSON(defaultFallbackData, "Poligon Chișinău (Demo)");
      });

    // 7. Slider pentru Opacitate
    const opacityControl = L.control({ position: 'bottomright' });
    opacityControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'opacity-control');
      div.innerHTML = `
        <label for="opacitySlider">Opacitate strat:</label>
        <input id="opacitySlider" type="range" min="0" max="1" step="0.1" value="0.3">
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    opacityControl.addTo(map);

    document.getElementById('opacitySlider').addEventListener('input', function (e) {
      if (qgisLayer) {
        const val = parseFloat(e.target.value);
        qgisLayer.setStyle({ fillOpacity: val, opacity: val });
      }
    });
  </script>

</body>
</html>
