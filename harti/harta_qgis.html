
<!DOCTYPE html>
<html lang="ro">
<head>
  <title>Hartă Interactivă - Zonificare PUG/PUZ/PUD</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS & JS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS & JS Leaflet Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

  <!-- JS Turf.js pentru calcule de arie și perimetru -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    #map { 
      height: 100vh; 
      width: 100vw; 
    }

    /* Stil pentru butonul Înapoi */
    .back-button {
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-decoration: none;
      color: #1e293b;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-button:hover {
      background: #f1f5f9;
    }

    /* Stil pentru panoul de opacitate (dreapta jos) */
    .opacity-control {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 10px;
    }
    .opacity-control input {
      display: block;
      margin-top: 5px;
      cursor: pointer;
      width: 130px;
    }

    /* Stil pentru Legenda Cartografică (stânga jos) */
    .legend-control {
      background: white;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      font-size: 12px;
      color: #1e293b;
      max-height: 280px;
      overflow-y: auto;
      line-height: 1.4;
      max-width: 280px;
    }
    .legend-title {
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
      color: #0f172a;
    }
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      margin-right: 8px;
      border: 1px solid #475569;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Inițializăm harta pe coordonatele Chișinăului
    const map = L.map('map').setView([47.0167, 28.8333], 13);

    // 2. Setări Geoman (Măsurători & Desenare)
    map.pm.addControls({
      position: 'topleft',
      drawMarker: true,
      drawPolyline: true,
      drawRectangle: true,
      drawPolygon: true,
      drawCircle: false,
      drawCircleMarker: false,
      editMode: false,
      dragMode: false,
      cutPolygon: false,
      rotateMode: false,
      removalMode: true
    });

    // 3. Calcul Arie și Perimetru cu Turf.js
    map.on('pm:create', function(e) {
      const layer = e.layer;
      if (layer.options && layer.options.pmIgnore) return;

      const geojson = layer.toGeoJSON();

      if (e.shape === 'Line' || e.shape === 'Polyline') {
        const lengthMeters = turf.length(geojson, { units: 'meters' });
        let text = lengthMeters > 1000 
          ? (lengthMeters / 1000).toFixed(2) + ' km' 
          : lengthMeters.toFixed(1) + ' m';
        layer.bindPopup(`<b>Lungime:</b> ${text}`).openPopup();
      } 
      else if (e.shape === 'Polygon' || e.shape === 'Rectangle') {
        const areaM2 = turf.area(geojson);
        const perimeterMeters = turf.length(geojson, { units: 'meters' });

        let areaText = areaM2 >= 10000 
          ? (areaM2 / 10000).toFixed(2) + ' ha (' + (areaM2 / 1000000).toFixed(2) + ' km²)' 
          : areaM2.toFixed(1) + ' m²';

        let perimText = perimeterMeters >= 1000 
          ? (perimeterMeters / 1000).toFixed(2) + ' km' 
          : perimeterMeters.toFixed(1) + ' m';

        layer.bindPopup(`<b>Suprafață:</b> ${areaText}<br><b>Perimetru:</b> ${perimText}`).openPopup();
      }
    });

    // 4. Straturile de fundal
    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles © Esri'
    });

    // 5. Butonul Înapoi
    const backControl = L.control({ position: 'topleft' });
    backControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.innerHTML = `<a href="../index.html" class="back-button">⬅️ Înapoi la Lista de Hărți</a>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    backControl.addTo(map);

    // 6. Meniul de straturi (Selector dreapta-sus)
    const baseMaps = {
      "Google Satelit": googleSat,
      "Esri Topografic": esriTopo
    };
    const overlayMaps = {};
    
    const layerControl = L.control.layers(baseMaps, overlayMaps, { 
      position: 'topright',
      collapsed: false 
    }).addTo(map);

    // 7. Regulile de culori pentru legendă conform QGIS
    const qgisLegendRules = [
      { code: 0, color: '#FF0000', name: '0 - Constr. tehnico-edilitare' },
      { code: 1, color: '#F2E385', name: '1 - Locuințe și funcț. compl.' },
      { code: 2, color: '#D9534F', name: '2 - Constr. publice și afaceri' },
      { code: 3, color: '#8B7D7B', name: '3 - Industriale și agricole' },
      { code: 4, color: '#9BE3DE', name: '4 - Destinație specială' },
      { code: 5, color: '#B5E655', name: '5 - Recreere' },
      { code: 6, color: '#75996A', name: '6 - Suprafețe forestiere' },
      { code: 7, color: '#D2EBE3', name: '7 - Suprafețe acvatice' },
      { code: 8, color: '#DEECC0', name: '8 - Terenuri agricole / grădini' },
      { code: 9, color: '#A8A8A8', name: '9 - Circulație rutieră' },
      { code: 10, color: '#B0B0B0', name: '10 - Alte terenuri' }
    ];

    function getColorByValoare(val) {
      const num = Number(val);
      const found = qgisLegendRules.find(r => r.code === num);
      return found ? found.color : '#5B82C6';
    }

    // 8. Adăugarea stratului PUG pe hartă
    let qgisLayerGroup = null;

    function addQGISLayer(data, labelName) {
      if (!data) return;

      qgisLayerGroup = L.geoJSON(data, {
        style: function (feature) {
          const valAtribut = feature.properties ? feature.properties["funct_corectat_3"] : null;
          return {
            color: "#334155",
            weight: 0.8,
            fillColor: getColorByValoare(valAtribut),
            fillOpacity: 0.7,
            opacity: 1
          };
        },
        onEachFeature: function (feature, layerObj) {
          if (layerObj && layerObj.options) {
            layerObj.options.pmIgnore = true;
          }
          if (feature.properties) {
            let popupContent = "<b>Atribute zonă:</b><br><hr style='margin:4px 0;'>";
            for (let prop in feature.properties) {
              popupContent += `<b>${prop}:</b> ${feature.properties[prop]}<br>`;
            }
            layerObj.bindPopup(popupContent);
          }
        }
      });

      qgisLayerGroup.addTo(map);
      qgisLayerGroup.options.pmIgnore = true;

      try {
        if (qgisLayerGroup.getBounds && qgisLayerGroup.getBounds().isValid()) {
          map.fitBounds(qgisLayerGroup.getBounds());
        }
      } catch (err) {
        console.warn("Nu s-au putut calcula limitele stratului:", err);
      }

      // Se adaugă ca strat separat în selectorul din dreapta-sus
      layerControl.addOverlay(qgisLayerGroup, labelName);
    }

    // 9. Legenda Cartografică (stânga-jos)
    const legendControl = L.control({ position: 'bottomleft' });
    legendControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend-control');
      let html = `<div class="legend-title">🎨 Legendă Zonificare (PUG)</div>`;
      
      qgisLegendRules.forEach(rule => {
        html += `
          <div class="legend-item">
            <div class="legend-color" style="background: ${rule.color};"></div>
            <span>${rule.name}</span>
          </div>
        `;
      });
      
      div.innerHTML = html;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    legendControl.addTo(map);

    // 10. Panou opacitate (dreapta-jos)
    const opacityControl = L.control({ position: 'bottomright' });
    opacityControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'opacity-control');
      div.innerHTML = `
        <label for="opacitySlider">Opacitate Zonificare:</label>
        <input id="opacitySlider" type="range" min="0" max="1" step="0.1" value="0.7">
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    opacityControl.addTo(map);

    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'opacitySlider') {
        const val = parseFloat(e.target.value);
        if (qgisLayerGroup) {
          qgisLayerGroup.eachLayer(function (l) {
            if (l.setStyle) {
              l.setStyle({ fillOpacity: val });
            }
          });
        }
      }
    });

    // 11. Încărcare fișier zonificare_1.geojson
    fetch('../straturi/zonificare_1.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Fișierul zonificare_1.geojson nu a fost găsit.');
        }
        return response.json();
      })
      .then(data => {
        console.log("Fișierul zonificare_1.geojson a fost încărcat cu succes.");
        addQGISLayer(data, "📍 Zonificare Funcțională PUG");
      })
      .catch(error => {
        console.error("Eroare la încărcarea stratului:", error);
      });
  </script>

</body>
</html>
