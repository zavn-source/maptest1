
<!DOCTYPE html>
<html lang="ro">
<head>
  <title>Hartă Interactivă - PUG/PUZ/PUD</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS & JS Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS & JS Leaflet Geoman -->
  <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.css" />
  <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@latest/dist/leaflet-geoman.min.js"></script>

  <!-- JS Turf.js pentru calcule de arie și perimetru -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    #map { 
      height: 100vh; 
      width: 100vw; 
    }

    /* Stil pentru butonul Înapoi */
    .back-button {
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      text-decoration: none;
      color: #1e293b;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      transition: background 0.2s;
    }
    .back-button:hover {
      background: #f1f5f9;
    }

    /* Stil pentru panoul de opacitate (dreapta jos) */
    .opacity-control {
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 13px;
      font-weight: bold;
      color: #0f172a;
    }
    .opacity-control input {
      display: block;
      margin-top: 5px;
      cursor: pointer;
      width: 120px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    // 1. Inițializăm harta pe coordonatele Chișinăului
    const map = L.map('map').setView([47.0167, 28.8333], 13);

    // 2. Setări Geoman (Măsurători & Desenare)
    map.pm.addControls({
      position: 'topleft',
      drawMarker: true,
      drawPolyline: true,
      drawRectangle: true,
      drawPolygon: true,
      drawCircle: false,
      drawCircleMarker: false,
      editMode: false,      // Fără editare pe stratul QGIS
      dragMode: false,      // Fără mutare
      cutPolygon: false,
      rotateMode: false,    // Fără rotire
      removalMode: true     // Permite ștergerea geometriilor create
    });

    // 3. Calcul Arie și Perimetru cu Turf.js
    map.on('pm:create', function(e) {
      const layer = e.layer;
      
      if (layer.options && layer.options.pmIgnore) return;

      const geojson = layer.toGeoJSON();

      if (e.shape === 'Line' || e.shape === 'Polyline') {
        const lengthMeters = turf.length(geojson, { units: 'meters' });
        let text = lengthMeters > 1000 
          ? (lengthMeters / 1000).toFixed(2) + ' km' 
          : lengthMeters.toFixed(1) + ' m';
        layer.bindPopup(`<b>Lungime:</b> ${text}`).openPopup();
      } 
      else if (e.shape === 'Polygon' || e.shape === 'Rectangle') {
        const areaM2 = turf.area(geojson);
        const perimeterMeters = turf.length(geojson, { units: 'meters' });

        let areaText = areaM2 >= 10000 
          ? (areaM2 / 10000).toFixed(2) + ' ha (' + (areaM2 / 1000000).toFixed(2) + ' km²)' 
          : areaM2.toFixed(1) + ' m²';

        let perimText = perimeterMeters >= 1000 
          ? (perimeterMeters / 1000).toFixed(2) + ' km' 
          : perimeterMeters.toFixed(1) + ' m';

        layer.bindPopup(`<b>Suprafață:</b> ${areaText}<br><b>Perimetru:</b> ${perimText}`).openPopup();
      }
    });

    // 4. Straturile de fundal
    const googleSat = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
      maxZoom: 20,
      subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
      attribution: '© Google Maps'
    }).addTo(map);

    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles © Esri'
    });

    // 5. Butonul Înapoi
    const backControl = L.control({ position: 'topleft' });
    backControl.onAdd = function () {
      const div = L.DomUtil.create('div');
      div.innerHTML = `<a href="../index.html" class="back-button">⬅️ Înapoi la Lista de Hărți</a>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    backControl.addTo(map);

    // 6. Meniul de straturi
    const baseMaps = {
      "Google Satelit": googleSat,
      "Esri Topografic": esriTopo
    };
    const overlayMaps = {};
    
    const layerControl = L.control.layers(baseMaps, overlayMaps, { 
      position: 'topright',
      collapsed: true 
    }).addTo(map);

    // 7. Funcție pentru obținerea culorilor pe baza codului din legenda QGIS
    function getColorByValoare(val) {
      const num = Number(val);
      switch (num) {
        case 0:  return '#FF0000'; // Roșu - Lucrări tehnico-edilitare
        case 1:  return '#F2E385'; // Galben deschis - Locuințe
        case 2:  return '#D9534F'; // Roșu/Carămiziu - Construcții publice / afaceri
        case 3:  return '#8B7D7B'; // Gri/Maro - Industriale și agricole
        case 4:  return '#9BE3DE'; // Turcoaz/Verde deschis - Destinație specială
        case 5:  return '#B5E655'; // Verde deschis - Recreere
        case 6:  return '#75996A'; // Verde închis - Suprafețe forestiere
        case 7:  return '#D2EBE3'; // Albastru foarte deschis - Suprafețe acvatice
        case 8:  return '#DEECC0'; // Verde-galben deschis - Terenuri agricole / grădini
        case 9:  return '#A8A8A8'; // Gri - Circulație rutieră
        case 10: return '#B0B0B0'; // Gri - Alte terenuri
        default: return '#5B82C6'; // Albastru - Alte valori
      }
    }

    // 8. Gruparea și adăugarea stratului QGIS
    let qgisLayerGroup = null;

    function addQGISLayer(data, labelName) {
      if (!data) return;

      qgisLayerGroup = L.geoJSON(data, {
        style: function (feature) {
          // Preluăm cifra din câmpul "funct_corectat_3"
          const valAtribut = feature.properties ? feature.properties["funct_corectat_3"] : null;

          return {
            color: "#4A4A4A",                        // Contur gri închis
            weight: 0.8,                             // Grosime contur
            fillColor: getColorByValoare(valAtribut), // Culoarea stabilită din legendă
            fillOpacity: 0.7,                        // Opacitate umplere inițială
            opacity: 1
          };
        },
        pointToLayer: function (feature, latlng) {
          const valAtribut = feature.properties ? feature.properties["funct_corectat_3"] : null;
          const marker = L.circleMarker(latlng, {
            radius: 8,
            fillColor: getColorByValoare(valAtribut),
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
          });
          marker.options.pmIgnore = true;
          return marker;
        },
        onEachFeature: function (feature, layerObj) {
          if (layerObj && layerObj.options) {
            layerObj.options.pmIgnore = true;
          }

          if (feature.properties) {
            let popupContent = "<b>Atribute obiect:</b><br><hr style='margin:4px 0;'>";
            for (let prop in feature.properties) {
              popupContent += `<b>${prop}:</b> ${feature.properties[prop]}<br>`;
            }
            layerObj.bindPopup(popupContent);
          }
        }
      });

      qgisLayerGroup.addTo(map);
      qgisLayerGroup.options.pmIgnore = true;

      try {
        if (qgisLayerGroup.getBounds && qgisLayerGroup.getBounds().isValid()) {
          map.fitBounds(qgisLayerGroup.getBounds());
        }
      } catch (err) {
        console.warn("Nu s-au putut calcula limitele stratului:", err);
      }

      layerControl.addOverlay(qgisLayerGroup, labelName);
    }

    // 9. Panou pentru opacitate
    const opacityControl = L.control({ position: 'bottomright' });
    opacityControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'opacity-control');
      div.innerHTML = `
        <label for="opacitySlider">Opacitate zonificare:</label>
        <input id="opacitySlider" type="range" min="0" max="1" step="0.1" value="0.7">
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    opacityControl.addTo(map);

    document.addEventListener('input', function (e) {
      if (e.target && e.target.id === 'opacitySlider') {
        const val = parseFloat(e.target.value);
        if (qgisLayerGroup) {
          qgisLayerGroup.eachLayer(function (l) {
            if (l.setStyle) {
              l.setStyle({ fillOpacity: val });
            }
          });
        }
      }
    });

    // 10. Date Fallback (Poligon demonstrativ dacă fișierul lipsește)
    const defaultFallbackData = {
      "type": "FeatureCollection",
      "features": [
        {
          "type": "Feature",
          "properties": {
            "funct_corectat_3": "1",
            "Nume": "Zonă demonstrativă Chișinău",
            "Sursa": "Poligon implicit (Fallback)",
            "Descriere": "Dacă vezi acest poligon, înseamnă că fișierul strat_qgis.geojson nu a fost încărcat sau lipsește."
          },
          "geometry": {
            "type": "Polygon",
            "coordinates": [
              [
                [28.8200, 47.0100],
                [28.8500, 47.0100],
                [28.8500, 47.0300],
                [28.8200, 47.0300],
                [28.8200, 47.0100]
              ]
            ]
          }
        }
      ]
    };

    // 11. Încărcare GeoJSON
    fetch('../straturi/strat_qgis.geojson')
      .then(response => {
        if (!response.ok) {
          throw new Error('Fișierul strat_qgis.geojson nu a fost găsit.');
        }
        return response.json();
      })
      .then(data => {
        console.log("Fișierul strat_qgis.geojson a fost încărcat cu succes.");
        addQGISLayer(data, "Zonificare PUG/PUZ");
      })
      .catch(error => {
        console.warn("Nu s-a putut încărca 'strat_qgis.geojson'. Se afișează poligonul demonstrativ de rezervă în Chișinău.", error);
        addQGISLayer(defaultFallbackData, "Poligon Chișinău (Demo)");
      });
  </script>

</body>
</html>
